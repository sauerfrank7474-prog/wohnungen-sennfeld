<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #1f4e5f;
    --accent: #c89b3c;
    --bg: #fafaf7;
    --text: #2b2b2b;
    --muted: #6b6b6b;
    --card: #ffffff;
    --border: #e5e1d8;
    --shadow: 0 6px 24px rgba(0,0,0,.08);
  }
  html { scroll-behavior: smooth; }
  body { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
         color: var(--text); background: var(--bg); line-height: 1.6; }
  img { max-width: 100%; display: block; }

  nav { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.95);
        backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  nav .inner { max-width: 1200px; margin: 0 auto; padding: 14px 24px;
               display: flex; justify-content: space-between; align-items: center; gap: 24px; }
  nav .back { color: var(--primary); text-decoration: none; font-weight: 600; font-size: .95rem; }
  nav .back:hover { color: var(--accent); }
  nav ul { list-style: none; display: flex; gap: 22px; flex-wrap: wrap; }
  nav a { color: var(--text); text-decoration: none; font-size: .95rem; transition: color .2s; }
  nav a:hover { color: var(--accent); }
  @media (max-width: 720px) { nav ul { display: none; } }

  .hero { position: relative; min-height: 70vh; color: #fff;
          display: flex; align-items: center; justify-content: center; text-align: center; padding: 80px 24px; }
  .hero-content { max-width: 900px; position: relative; z-index: 2; }
  .hero .badge { display: inline-block; padding: 6px 14px; background: var(--accent);
                 border-radius: 999px; font-size: .8rem; letter-spacing: 1px;
                 text-transform: uppercase; margin-bottom: 18px; }
  .hero h1 { font-size: clamp(1.8rem, 4.5vw, 3.2rem); font-weight: 700; line-height: 1.15; margin-bottom: 12px; }
  .hero p.sub { font-size: clamp(1rem, 2vw, 1.25rem); opacity: .95; margin-bottom: 28px; }
  .hero .price { font-size: 1.4rem; font-weight: 600; margin-bottom: 28px; }
  .hero .price small { font-size: .9rem; font-weight: 400; opacity: .85; }
  .cta { display: inline-block; padding: 14px 30px; background: var(--accent); color: #fff;
         text-decoration: none; font-weight: 600; border-radius: 6px;
         transition: transform .15s, background .2s; }
  .cta:hover { background: #b48a2f; transform: translateY(-2px); }
  .cta.secondary { background: transparent; border: 2px solid #fff; margin-left: 10px; }
  .cta.secondary:hover { background: #fff; color: var(--primary); }

  section { max-width: 1200px; margin: 0 auto; padding: 70px 24px; }
  section h2 { font-size: clamp(1.5rem, 3vw, 2.2rem); color: var(--primary); margin-bottom: 8px; }
  section .subtitle { color: var(--muted); margin-bottom: 36px; font-size: 1.05rem; }

  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
  .fact { background: var(--card); padding: 22px 18px; border-radius: 10px;
          border: 1px solid var(--border); text-align: center; box-shadow: var(--shadow); }
  .fact .label { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; }
  .fact .value { font-size: 1.4rem; font-weight: 700; color: var(--primary); margin-top: 6px; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: start; }
  @media (max-width: 820px) { .two-col { grid-template-columns: 1fr; gap: 30px; } }
  .two-col p { margin-bottom: 14px; }
  .two-col h3 { color: var(--primary); margin: 20px 0 10px; font-size: 1.15rem; }
  .feature-list { list-style: none; }
  .feature-list li { padding: 8px 0 8px 28px; position: relative; border-bottom: 1px solid var(--border); }
  .feature-list li:before { content: "✓"; position: absolute; left: 0; color: var(--accent); font-weight: 700; }
  .feature-list li:last-child { border-bottom: 0; }

  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .gallery figure { position: relative; overflow: hidden; border-radius: 8px; cursor: pointer;
                    aspect-ratio: 4/3; background: #eee; box-shadow: var(--shadow); }
  .gallery img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
  .gallery figure:hover img { transform: scale(1.06); }
  .gallery figcaption { position: absolute; bottom: 0; left: 0; right: 0;
                        padding: 10px 14px; color: #fff; font-size: .9rem; font-weight: 500;
                        background: linear-gradient(transparent, rgba(0,0,0,.7)); }

  .lightbox { display: none; position: fixed; inset: 0; z-index: 100;
              background: rgba(0,0,0,.95); align-items: center; justify-content: center; padding: 30px; }
  .lightbox.active { display: flex; }
  .lightbox img { max-width: 95vw; max-height: 85vh; object-fit: contain; border-radius: 4px; }
  .lightbox .lb-caption { position: absolute; bottom: 70px; left: 0; right: 0; text-align: center;
                           color: #fff; font-size: 1.05rem; padding: 0 20px; }
  .lightbox button { position: absolute; background: rgba(255,255,255,.15); border: 0;
                     color: #fff; width: 50px; height: 50px; border-radius: 50%;
                     font-size: 1.5rem; cursor: pointer; transition: background .2s; }
  .lightbox button:hover { background: rgba(255,255,255,.3); }
  .lb-close { top: 20px; right: 20px; }
  .lb-prev { left: 20px; top: 50%; transform: translateY(-50%); }
  .lb-next { right: 20px; top: 50%; transform: translateY(-50%); }
  .lb-counter { position: absolute; top: 30px; left: 30px; color: #fff; font-size: .95rem; opacity: .7; }

  .lage-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 40px; align-items: start; }
  @media (max-width: 820px) { .lage-grid { grid-template-columns: 1fr; } }
  .infra-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .infra-tags span { padding: 6px 14px; background: var(--card); border: 1px solid var(--border);
                     border-radius: 999px; font-size: .85rem; color: var(--primary); }
  .map-embed { width: 100%; aspect-ratio: 4/3; border: 0; border-radius: 10px; box-shadow: var(--shadow); }
  .map-placeholder {
    width: 100%; aspect-ratio: 4/3; border-radius: 10px; box-shadow: var(--shadow);
    background: #eef3f1 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 14c-12 0-22 10-22 22 0 17 22 50 22 50s22-33 22-50c0-12-10-22-22-22zm0 30a8 8 0 110-16 8 8 0 010 16z' fill='%231f4e5f' opacity='.18'/></svg>") center/30% no-repeat;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background-color .2s;
    border: 1px solid var(--border); padding: 30px; text-align: center;
  }
  .map-placeholder:hover { background-color: #e1ebe8; }
  .map-placeholder .map-info { background: rgba(255,255,255,.85); padding: 18px 22px; border-radius: 8px; max-width: 360px; }
  .map-placeholder .map-info strong { color: var(--primary); display: block; margin-bottom: 8px; font-size: 1.05rem; }
  .map-placeholder .map-info p { font-size: .85rem; color: var(--muted); margin: 8px 0 14px; line-height: 1.5; }
  .map-placeholder .map-info button {
    padding: 10px 22px; background: var(--accent); color: #fff; border: 0;
    border-radius: 6px; font-weight: 600; cursor: pointer; transition: background .2s;
  }
  .map-placeholder .map-info button:hover { background: #b48a2f; }

  .energy { background: var(--card); padding: 26px; border-radius: 10px; border: 1px solid var(--border);
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px;
            box-shadow: var(--shadow); }
  .energy .label { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; }
  .energy .value { font-size: 1.1rem; font-weight: 600; color: var(--primary); margin-top: 4px; }

  .note-card { background: #fff7e6; border-left: 4px solid var(--accent);
               padding: 20px 24px; border-radius: 6px; margin-bottom: 14px; }

  .kontakt { background: var(--primary); color: #fff; padding: 60px 24px; }
  .kontakt .inner { max-width: 800px; margin: 0 auto; text-align: center; }
  .kontakt h2 { color: #fff; }
  .kontakt .subtitle { color: rgba(255,255,255,.8); }
  .kontakt-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; margin-top: 30px; }
  .kontakt-info a { color: #fff; text-decoration: none; font-weight: 600; font-size: 1.2rem; }
  .kontakt-info a:hover { color: var(--accent); }
  .kontakt-info .label { font-size: .85rem; opacity: .8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }

  .kontakt .cta { display: inline-block; }
  .kontakt .divider {
    display: flex; align-items: center; gap: 16px;
    margin: 50px 0 30px; color: rgba(255,255,255,.7); font-size: .9rem;
    text-transform: uppercase; letter-spacing: 2px;
  }
  .kontakt .divider::before, .kontakt .divider::after {
    content: ""; flex: 1; height: 1px; background: rgba(255,255,255,.2);
  }
  .kontakt form {
    background: #fff; color: var(--text); padding: 32px 28px;
    border-radius: 12px; text-align: left; box-shadow: 0 12px 36px rgba(0,0,0,.18);
  }
  .kontakt form h3 { color: var(--primary); margin-bottom: 6px; font-size: 1.3rem; }
  .kontakt form .form-sub { color: var(--muted); font-size: .92rem; margin-bottom: 22px; }
  .kontakt .form-row { display: grid; gap: 18px; }
  .kontakt .form-row.two { grid-template-columns: 1fr 1fr; }
  @media (max-width: 600px) { .kontakt .form-row.two { grid-template-columns: 1fr; } }
  .kontakt label { display: block; font-size: .85rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .kontakt label .req { color: #c0392b; }
  .kontakt input, .kontakt textarea {
    width: 100%; padding: 11px 14px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 1rem; font-family: inherit;
    background: var(--bg); color: var(--text);
    transition: border-color .2s, background .2s;
  }
  .kontakt input:focus, .kontakt textarea:focus { outline: 0; border-color: var(--accent); background: #fff; }
  .kontakt textarea { resize: vertical; min-height: 100px; }
  .kontakt .hp { position: absolute; left: -9999px; opacity: 0; }
  .kontakt button[type=submit] {
    width: 100%; padding: 14px; background: var(--accent); color: #fff;
    border: 0; border-radius: 6px; font-size: 1.05rem; font-weight: 600;
    cursor: pointer; margin-top: 22px; transition: background .2s, transform .15s;
  }
  .kontakt button[type=submit]:hover { background: #b48a2f; transform: translateY(-1px); }
  .kontakt button[type=submit]:disabled { background: #aaa; cursor: not-allowed; transform: none; }
  .kontakt .privacy-hint { font-size: .78rem; color: var(--muted); margin-top: 16px; text-align: center; }
  .form-result { margin-top: 18px; padding: 14px 18px; border-radius: 6px; font-weight: 500; display: none; }
  .form-result.success { display: block; background: #e8f5e9; color: #1b5e20; border-left: 4px solid #2e7d32; }
  .form-result.error   { display: block; background: #fdecea; color: #7f1d1d; border-left: 4px solid #c0392b; }

  footer { text-align: center; padding: 28px 24px; background: #1a1a1a; color: #aaa; font-size: .85rem; }
  footer a { color: var(--accent); text-decoration: none; margin: 0 6px; }
  footer a:hover { text-decoration: underline; }
  footer .legal { margin-top: 8px; }

  .not-found { max-width: 700px; margin: 100px auto; text-align: center; padding: 40px 24px; }
  .not-found h1 { color: var(--primary); margin-bottom: 16px; }
</style>
</head>

<nav>
  <div class="inner">
    <a href="index.html" class="back">← Zur Übersicht</a>
    <ul>
      <li><a href="#eckdaten">Eckdaten</a></li>
      <li><a href="#beschreibung">Beschreibung</a></li>
      <li><a href="#galerie">Galerie</a></li>
      <li><a href="#lage">Lage</a></li>
      <li><a href="#kontakt">Kontakt</a></li>
    </ul>
  </div>
</nav>

<main id="main"></main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Bildergalerie Großansicht">
  <div class="lb-counter" id="lbCounter"></div>
  <button class="lb-close" id="lbClose" aria-label="Schließen">×</button>
  <button class="lb-prev" id="lbPrev" aria-label="Vorheriges Bild">‹</button>
  <img id="lbImage" src="" alt="">
  <div class="lb-caption" id="lbCaption"></div>
  <button class="lb-next" id="lbNext" aria-label="Nächstes Bild">›</button>
</div>

<footer id="footer">
  © 2026 · Privates Mietangebot
</footer>

<script src="data/wohnungen.js"></script>
<script>
(function () {
  const fmtEUR = n => new Intl.NumberFormat('de-DE').format(n) + ' €';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const nl2p = s => esc(s).split(/\n\s*\n/).map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');

  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const w = WOHNUNGEN.find(x => x.id === id);
  const main = document.getElementById('main');

  if (!w) {
    main.innerHTML = `
      <div class="not-found">
        <h1>Wohnung nicht gefunden</h1>
        <p>Die angefragte Wohnung existiert nicht oder ist nicht mehr verfügbar.</p>
        <p style="margin-top:20px;"><a href="index.html" class="cta">← Zurück zur Übersicht</a></p>
      </div>`;
    return;
  }

  const haus = HAEUSER.find(h => h.id === w.hausId) || {};
  const heroImg = (w.bilder && w.bilder[0]) ? w.bilder[0].src : '';
  const nkSum = (w.nebenkosten || 0) + (w.heizkosten || 0);

  // Page meta — Schweinfurt prominent für Suchmaschinen
  const ortLang = haus.ort === 'Sennfeld' ? 'Sennfeld bei Schweinfurt' : (haus.ort || '');
  const titel = `${w.titel} – ${haus.adresse || ''}, ${ortLang}`;
  const desc = w.untertitel || (w.beschreibung || '').slice(0, 160);
  const pageUrl = location.origin + location.pathname + '?id=' + encodeURIComponent(w.id);
  const heroImgAbs = heroImg ? (location.origin + location.pathname.replace(/wohnung\.html$/,'') + heroImg) : '';

  document.getElementById('pageTitle').textContent = titel;
  document.getElementById('pageDesc').setAttribute('content', desc);
  document.getElementById('canonicalLink').setAttribute('href', pageUrl);

  // Open Graph + Twitter — auch pro Wohnung
  const setMeta = (id, val) => { const el = document.getElementById(id); if (el && val) el.setAttribute('content', val); };
  setMeta('ogType', 'product');
  setMeta('ogTitle', titel);
  setMeta('ogDesc', desc);
  setMeta('ogUrl', pageUrl);
  setMeta('ogImage', heroImgAbs);
  setMeta('twTitle', titel);
  setMeta('twDesc', desc);
  setMeta('twImage', heroImgAbs);

  // Schema.org JSON-LD (Apartment + Offer)
  try {
    const jsonLd = {
      "@context": "https://schema.org",
      "@type": "Apartment",
      "name": w.titel,
      "description": w.beschreibung || w.untertitel || '',
      "url": pageUrl,
      "numberOfRooms": w.zimmer,
      "numberOfBedrooms": w.schlafzimmer,
      "numberOfBathroomsTotal": w.badezimmer,
      "yearBuilt": w.baujahr,
      "floorLevel": w.etage,
      "floorSize": w.wohnflaeche ? { "@type": "QuantitativeValue", "value": w.wohnflaeche, "unitCode": "MTK" } : undefined,
      "address": {
        "@type": "PostalAddress",
        "streetAddress": haus.adresse,
        "postalCode": haus.plz,
        "addressLocality": haus.ort,
        "addressRegion": "Bayern",
        "addressCountry": "DE"
      },
      "geo": (w.lat && w.lon) ? { "@type": "GeoCoordinates", "latitude": w.lat, "longitude": w.lon } : undefined,
      "image": (w.bilder || []).map(b => location.origin + location.pathname.replace(/wohnung\.html$/,'') + b.src),
      "amenityFeature": (w.highlights || []).map(h => ({ "@type": "LocationFeatureSpecification", "name": h, "value": true })),
      "petsAllowed": false,
      "offers": w.kaltmiete ? {
        "@type": "Offer",
        "price": w.kaltmiete,
        "priceCurrency": "EUR",
        "priceSpecification": {
          "@type": "UnitPriceSpecification",
          "price": w.kaltmiete,
          "priceCurrency": "EUR",
          "unitCode": "MON",
          "name": "Kaltmiete pro Monat"
        },
        "availability": w.status === 'verfügbar' ? "https://schema.org/InStock" :
                        w.status === 'reserviert' ? "https://schema.org/LimitedAvailability" :
                        "https://schema.org/OutOfStock",
        "availabilityStarts": w.verfuegbarAb,
        "seller": (typeof KONTAKT !== 'undefined') ? {
          "@type": "Person",
          "name": KONTAKT.name,
          "telephone": KONTAKT.telefonE164
        } : undefined
      } : undefined
    };
    const s = document.createElement('script');
    s.type = 'application/ld+json';
    s.textContent = JSON.stringify(jsonLd, (k, v) => v === undefined ? undefined : v, 2);
    document.head.appendChild(s);
  } catch (e) { /* ignore */ }

  // Footer
  document.getElementById('footer').innerHTML =
    `© ${new Date().getFullYear()} Frank Sauer · ${esc(haus.adresse || '')}, ${esc(haus.plz || '')} ${esc(haus.ort || '')}` +
    `<div class="legal"><a href="index.html">Startseite</a> · <a href="impressum.html">Impressum</a> · <a href="datenschutz.html">Datenschutz</a></div>`;

  // HERO
  const statusBadge = w.status === 'reserviert' ? 'Reserviert' :
                       w.status === 'vermietet' ? 'Vermietet' :
                       (w.verfuegbarAb ? `Zu vermieten · ab ${w.verfuegbarAb}` : 'Zu vermieten');

  let html = `
    <header class="hero" style="background: linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.55)), url('${esc(heroImg)}') center/cover;">
      <div class="hero-content">
        <div class="badge">${esc(statusBadge)}</div>
        <h1>${esc(w.titel)}</h1>
        <p class="sub">${esc(w.untertitel || '')}</p>
        ${w.kaltmiete ? `<div class="price">${fmtEUR(w.kaltmiete)} Kaltmiete <small>${nkSum ? '+ ' + fmtEUR(nkSum) + ' NK' : ''}${w.stellplatz ? ' · + ' + fmtEUR(w.stellplatz) + ' Stellplatz' : ''}</small></div>` : ''}
        <a href="#kontakt" class="cta">Besichtigung anfragen</a>
        <a href="#galerie" class="cta secondary">Bilder ansehen</a>
      </div>
    </header>
  `;

  // ECKDATEN
  const facts = [
    w.wohnflaeche      && { l: 'Wohnfläche',  v: w.wohnflaeche + ' m²' },
    w.zimmer           && { l: 'Zimmer',      v: w.zimmer },
    w.etage            && { l: 'Etage',       v: w.etage },
    w.baujahr          && { l: 'Baujahr',     v: w.baujahr },
    w.zustand          && { l: 'Zustand',     v: w.zustand },
    w.kaltmiete        && { l: 'Kaltmiete',   v: fmtEUR(w.kaltmiete) },
    (w.nebenkosten||w.heizkosten) && { l: 'Nebenkosten', v: fmtEUR(nkSum) },
    w.stellplatz       && { l: 'Stellplatz',  v: fmtEUR(w.stellplatz) },
    w.kaution          && { l: 'Kaution',     v: fmtEUR(w.kaution) },
    w.verfuegbarAb     && { l: 'Verfügbar',   v: w.verfuegbarAb },
    w.heizung          && { l: 'Heizung',     v: w.heizung + (w.energietraeger ? ' (' + w.energietraeger + ')' : '') }
  ].filter(Boolean);

  html += `
    <section id="eckdaten">
      <h2>Eckdaten auf einen Blick</h2>
      <p class="subtitle">Alle wichtigen Informationen kompakt zusammengefasst</p>
      <div class="facts">
        ${facts.map(f => `<div class="fact"><div class="label">${esc(f.l)}</div><div class="value">${esc(f.v)}</div></div>`).join('')}
      </div>
    </section>
  `;

  // BESCHREIBUNG + HIGHLIGHTS + HINWEISE
  if (w.beschreibung || w.ausstattung || (w.highlights && w.highlights.length) || (w.hinweise && w.hinweise.length)) {
    html += `
      <section id="beschreibung">
        <h2>Die Wohnung</h2>
        <p class="subtitle">Durchdachte Raumaufteilung und hochwertige Ausstattung</p>
        <div class="two-col">
          <div>
            ${w.beschreibung ? `<h3>Objektbeschreibung</h3>${nl2p(w.beschreibung)}` : ''}
            ${w.ausstattung ? `<h3>Ausstattung &amp; Technik</h3>${nl2p(w.ausstattung)}` : ''}
          </div>
          <div>
            ${(w.highlights && w.highlights.length) ? `
              <h3>Highlights</h3>
              <ul class="feature-list">
                ${w.highlights.map(h => `<li>${esc(h)}</li>`).join('')}
              </ul>
            ` : ''}
            ${(w.hinweise && w.hinweise.length) ? `
              <h3>Sonstiges</h3>
              ${w.hinweise.map(h => `<div class="note-card"><strong>${esc(h.titel)}:</strong> ${esc(h.text)}</div>`).join('')}
            ` : ''}
          </div>
        </div>
      </section>
    `;
  }

  // GALERIE
  if (w.bilder && w.bilder.length) {
    html += `
      <section id="galerie">
        <h2>Bildergalerie</h2>
        <p class="subtitle">Klick auf ein Bild für die Großansicht</p>
        <div class="gallery" id="galleryGrid">
          ${w.bilder.map(b => `
            <figure data-caption="${esc(b.caption||'')}">
              <img src="${esc(b.src)}" alt="${esc(b.caption||'')}" loading="lazy">
              ${b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : ''}
            </figure>
          `).join('')}
        </div>
      </section>
    `;
  }

  // ENERGIE
  if (w.energieausweisTyp || w.endenergiebedarf) {
    const istVerbrauch = (w.energieausweisTyp || '').toLowerCase().includes('verbrauch');
    const bedarfLabel = istVerbrauch ? 'Endenergieverbrauch' : 'Endenergiebedarf';
    html += `
      <section id="energie">
        <h2>Energieausweis</h2>
        <p class="subtitle">Pflichtangaben gemäß § 87 GEG</p>
        <div class="energy">
          ${w.energieausweisTyp       ? `<div><div class="label">Ausweistyp</div><div class="value">${esc(w.energieausweisTyp)}</div></div>` : ''}
          ${w.energieausweisDatum     ? `<div><div class="label">Gültigkeit</div><div class="value">${esc(w.energieausweisDatum)}</div></div>` : ''}
          ${w.endenergiebedarf        ? `<div><div class="label">${bedarfLabel}</div><div class="value">${esc(w.endenergiebedarf)}</div></div>` : ''}
          ${w.energieeffizienzklasse  ? `<div><div class="label">Energieeffizienzklasse</div><div class="value" style="color:#2e7d32;">${esc(w.energieeffizienzklasse)}</div></div>` : ''}
          ${w.energietraeger          ? `<div><div class="label">Energieträger</div><div class="value">${esc(w.energietraeger)}</div></div>` : ''}
          ${w.baujahrWaermeerzeuger   ? `<div><div class="label">Baujahr Wärmeerzeuger</div><div class="value">${esc(w.baujahrWaermeerzeuger)}</div></div>` : ''}
          ${w.energieausweisRegNr     ? `<div><div class="label">Registriernummer</div><div class="value" style="font-size:.95rem;">${esc(w.energieausweisRegNr)}</div></div>` : ''}
        </div>
      </section>
    `;
  }

  // LAGE
  if (w.lage || (w.infrastruktur && w.infrastruktur.length) || (w.lat && w.lon)) {
    const bbox = (w.lat && w.lon)
      ? `${(w.lon-0.02).toFixed(4)}%2C${(w.lat-0.0125).toFixed(4)}%2C${(w.lon+0.02).toFixed(4)}%2C${(w.lat+0.0125).toFixed(4)}`
      : null;
    html += `
      <section id="lage">
        <h2>Lage</h2>
        <p class="subtitle">${esc(haus.adresse || '')}, ${esc(haus.plz || '')} ${esc(haus.ort || '')}</p>
        <div class="lage-grid">
          <div>
            ${w.lage ? nl2p(w.lage) : ''}
            ${(w.infrastruktur && w.infrastruktur.length) ? `
              <h3>Infrastruktur in der Nähe</h3>
              <div class="infra-tags">
                ${w.infrastruktur.map(i => `<span>${esc(i)}</span>`).join('')}
              </div>
            ` : ''}
          </div>
          <div>
            ${bbox ? `
              <div class="map-placeholder" id="mapPlaceholder"
                   data-bbox="${bbox}" data-lat="${w.lat}" data-lon="${w.lon}"
                   data-title="${esc('Karte: ' + (haus.adresse || '') + ', ' + (haus.ort || ''))}"
                   role="button" tabindex="0">
                <div class="map-info">
                  <strong>📍 Karte anzeigen</strong>
                  <p>Beim Klick wird die Karte von OpenStreetMap geladen. Dabei wird Ihre IP-Adresse an OpenStreetMap übermittelt. Weitere Informationen finden Sie in der <a href="datenschutz.html#osm">Datenschutzerklärung</a>.</p>
                  <button type="button">Karte laden</button>
                </div>
              </div>
              <p style="margin-top:12px; font-size:.9rem; color:var(--muted);">
                📍 ${esc(haus.adresse || '')}, ${esc(haus.plz || '')} ${esc(haus.ort || '')}<br>
                <a href="https://www.openstreetmap.org/?mlat=${w.lat}&mlon=${w.lon}#map=16/${w.lat}/${w.lon}" target="_blank" rel="noopener" style="color:var(--accent);">
                  In neuem Tab öffnen
                </a>
              </p>
            ` : `<p>📍 ${esc(haus.adresse || '')}, ${esc(haus.plz || '')} ${esc(haus.ort || '')}</p>`}
          </div>
        </div>
      </section>
    `;
  }

  // KONTAKT
  const k = (typeof KONTAKT !== 'undefined') ? KONTAKT : { name: 'Vermieter', telefon: '', telefonE164: '', web3formsKey: '' };
  const wohnungLabel = `${w.titel} – ${haus.adresse || ''}, ${haus.plz || ''} ${haus.ort || ''}`;
  html += `
    <section class="kontakt" id="kontakt">
      <div class="inner">
        <h2>Interesse? Sprechen Sie mich an.</h2>
        <p class="subtitle">Gerne vereinbare ich mit Ihnen einen Besichtigungstermin.</p>
        <div class="kontakt-info">
          <div><div class="label">Ansprechpartner</div><div style="font-size:1.2rem; font-weight:600;">${esc(k.name)}</div></div>
          ${k.telefon ? `<div><div class="label">Telefon</div><a href="tel:${esc(k.telefonE164)}">${esc(k.telefon)}</a></div>` : ''}
        </div>
        ${k.telefonE164 ? `<div style="margin-top:40px;"><a href="tel:${esc(k.telefonE164)}" class="cta">Jetzt anrufen</a></div>` : ''}

        <div class="divider">Oder Nachricht senden</div>

        <form id="kontaktForm" novalidate>
          <h3>Anfrage zu dieser Wohnung</h3>
          <p class="form-sub">${esc(wohnungLabel)}</p>

          <input type="hidden" name="access_key" value="${esc(k.web3formsKey || '')}">
          <input type="hidden" name="subject" value="${esc('Anfrage Wohnung: ' + wohnungLabel)}">
          <input type="hidden" name="from_name" value="Wohnungen Sennfeld – Webseite">
          <input type="hidden" name="wohnung" value="${esc(wohnungLabel)}">
          ${w.objektNr ? `<input type="hidden" name="objektnr" value="${esc(w.objektNr)}">` : ''}
          <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">

          <div class="form-row two">
            <div>
              <label for="f-name">Name <span class="req">*</span></label>
              <input type="text" id="f-name" name="name" required autocomplete="name">
            </div>
            <div>
              <label for="f-phone">Telefon <span class="req">*</span></label>
              <input type="tel" id="f-phone" name="phone" required autocomplete="tel">
            </div>
          </div>
          <div class="form-row" style="margin-top:18px;">
            <div>
              <label for="f-email">E-Mail <span class="req">*</span></label>
              <input type="email" id="f-email" name="email" required autocomplete="email">
            </div>
          </div>
          <div class="form-row" style="margin-top:18px;">
            <div>
              <label for="f-msg">Nachricht</label>
              <textarea id="f-msg" name="message" rows="4" placeholder="Was möchten Sie wissen? Wunsch-Besichtigungstermin?"></textarea>
            </div>
          </div>

          <button type="submit" id="f-submit">Anfrage senden</button>
          <div id="formResult" class="form-result" role="status" aria-live="polite"></div>
          <p class="privacy-hint">
            Ihre Daten werden ausschließlich zur Bearbeitung Ihrer Anfrage verwendet
            und nicht an Dritte weitergegeben.
          </p>
        </form>
      </div>
    </section>
  `;

  main.innerHTML = html;

  // OpenStreetMap erst nach Klick laden (DSGVO-konform)
  (function setupMap() {
    const ph = document.getElementById('mapPlaceholder');
    if (!ph) return;
    const load = () => {
      const bbox = ph.dataset.bbox, lat = ph.dataset.lat, lon = ph.dataset.lon, title = ph.dataset.title;
      const iframe = document.createElement('iframe');
      iframe.className = 'map-embed';
      iframe.setAttribute('title', title);
      iframe.src = `https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${lat}%2C${lon}`;
      ph.replaceWith(iframe);
    };
    ph.addEventListener('click', load);
    ph.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); load(); } });
  })();

  // Kontaktformular → Web3Forms
  (function setupForm() {
    const form = document.getElementById('kontaktForm');
    if (!form) return;
    const result = document.getElementById('formResult');
    const btn = document.getElementById('f-submit');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      result.className = 'form-result';
      result.textContent = '';
      const ak = form.querySelector('input[name=access_key]').value;
      if (!ak) {
        result.className = 'form-result error';
        result.textContent = 'Konfigurationsfehler: kein Access Key hinterlegt.';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Wird gesendet…';
      try {
        const data = Object.fromEntries(new FormData(form));
        const r = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(data)
        });
        const j = await r.json();
        if (j.success) {
          form.reset();
          result.className = 'form-result success';
          result.innerHTML = '✓ Vielen Dank! Ihre Anfrage ist eingegangen. Ich melde mich zeitnah bei Ihnen.';
          btn.textContent = 'Anfrage gesendet ✓';
        } else {
          result.className = 'form-result error';
          result.textContent = 'Leider ist ein Fehler aufgetreten: ' + (j.message || 'Unbekannter Fehler') + '. Bitte rufen Sie direkt an.';
          btn.disabled = false;
          btn.textContent = 'Erneut versuchen';
        }
      } catch (err) {
        result.className = 'form-result error';
        result.textContent = 'Verbindungsfehler. Bitte rufen Sie direkt unter ' + (k.telefon || '') + ' an.';
        btn.disabled = false;
        btn.textContent = 'Erneut versuchen';
      }
    });
  })();

  // Lightbox
  const figs = document.querySelectorAll('#galleryGrid figure');
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImage');
  const lbCap = document.getElementById('lbCaption');
  const lbCount = document.getElementById('lbCounter');
  let idx = 0;

  const open = (i) => {
    idx = i;
    const fig = figs[idx];
    const img = fig.querySelector('img');
    lbImg.src = img.src;
    lbImg.alt = img.alt;
    lbCap.textContent = fig.dataset.caption || '';
    lbCount.textContent = (idx+1) + ' / ' + figs.length;
    lb.classList.add('active');
    document.body.style.overflow = 'hidden';
  };
  const close = () => { lb.classList.remove('active'); document.body.style.overflow = ''; };
  const prev = () => open((idx - 1 + figs.length) % figs.length);
  const next = () => open((idx + 1) % figs.length);

  figs.forEach((f, i) => f.addEventListener('click', () => open(i)));
  document.getElementById('lbClose').addEventListener('click', close);
  document.getElementById('lbPrev').addEventListener('click', prev);
  document.getElementById('lbNext').addEventListener('click', next);
  lb.addEventListener('click', e => { if (e.target === lb) close(); });
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('active')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') prev();
    if (e.key === 'ArrowRight') next();
  });
})();
</script>

</body>
</html>
